name: Update Google Scholar publications

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-publications:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Refresh bibliography and citation counts
        run: python bin/update_scholar_publications.py

      - name: Commit and push changed Scholar data
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add _bibliography/papers.bib _data/citations.yml
          git diff --staged --quiet || git commit -m "Update Google Scholar publications"
          git push
